---
### geoschem_config.yml: GEOS-Chem Runtime configuration options.
### Customized for simulations using the aerosols-only mechanism.
###
### NOTE: Add quotes around nitrogen oxide ('NO'), because YAML
### parsers will confuse this with a negative "no" value.

#============================================================================
# Simulation settings
#============================================================================
simulation:
  name: aerosol
  start_date: [20190614, 000000]
  end_date: [20190701, 000000]
  root_data_dir: /shared-scratch/GEOS-Chem/ExtData
  met_field: GEOSFP
  species_database_file: ./species_database.yml
  species_metadata_output_file: OutputDir/geoschem_species_metadata.yml
  verbose:
    activate: false
    on_cores: root       # Allowed values: root all
  use_gcclassic_timers: false

#============================================================================
# Grid settings
#============================================================================
grid:
  resolution: 0.25x0.3125
  number_of_levels: 47
  longitude:
    range: [-124.5,  -105.5]
    center_at_180: true 
  latitude:
    range: [  24,  42]
    half_size_polar_boxes: true 
  nested_grid_simulation:
    activate: true 
    buffer_zone_NSEW: [3, 3, 3, 3]

#============================================================================
# Timesteps settings
#============================================================================
timesteps:
  transport_timestep_in_s: 300
  chemistry_timestep_in_s: 600

#============================================================================
# Settings for GEOS-Chem operations
#============================================================================
operations:

  chemistry:
    activate: true

  convection:
    activate: true

  dry_deposition:
    activate: true
    diag_alt_above_sfc_in_m: 10

  pbl_mixing:
     activate: true
     use_non_local_pbl: true 

  photolysis:
    activate: true
    input_directories:
      fastjx_input_dir: /shared-scratch/GEOS-Chem/ExtData/CHEM_INPUTS/FAST_JX/v2024-05/
      cloudj_input_dir: /shared-scratch/GEOS-Chem/ExtData/CHEM_INPUTS/CLOUD_J/v2023-05/
    overhead_O3:
      use_online_O3_from_model: false
      use_column_O3_from_met: true
      use_TOMS_SBUV_O3: false

  transport:
    gcclassic_tpcore:                 # GEOS-Chem Classic only
      activate: true                  # GEOS-Chem Classic only
      fill_negative_values: true      # GEOS-Chem Classic only
      iord_jord_kord: [3, 3, 7]       # GEOS-Chem Classic only
    transported_species:
      - BCPI
      - BCPO
      - DMS
      - DSTbin1
      - DSTbin2
      - DSTbin3
      - DSTbin4
      - DSTbin5
      - DSTbin6
      - DSTbin7
      - H2O2
      - MSA
      - NH3
      - NH4
      - NIT
      - NITs
      - OCPI
      - OCPO
      - pFe
      - SALA
      - SALAAL
      - SALACL
      - SALC
      - SALCAL
      - SALCCL
      - SO2
      - SO4
      - SO4s
      - SOAP
      - SOAS

  wet_deposition:
    activate: true

#============================================================================
# Settings for GEOS-Chem aerosols
#============================================================================
aerosols:

  carbon:
    activate: true
    brown_carbon: false
    enhance_black_carbon_absorption:
      activate: true
      hydrophilic: 1.5
      hydrophobic: 1.0

  dust:
    activate: true

  sea_salt:
    activate: true
    SALA_radius_bin_in_um: [0.01, 0.5]
    SALC_radius_bin_in_um: [0.5,  8.0]

  sulfate:
    activate: true
    metal_cat_SO2_oxidation: true

#============================================================================
# Settings for diagnostics (other than HISTORY and HEMCO)
#============================================================================
extra_diagnostics:

  obspack:
    activate: false
    quiet_logfile_output: false
    input_file: ./obspack_co2_1_OCO2MIP_2018-11-28.YYYYMMDD.nc
    output_file: ./OutputDir/GEOSChem.ObsPack.YYYYMMDD_hhmmz.nc4
    output_species:
      - BCPI
      
  planeflight:
    activate: false
    flight_track_file: Planeflight.dat.YYYYMMDD
    output_file: plane.log.YYYYMMDD
